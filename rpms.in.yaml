# RPM packages installed in the tools Containerfile stage.
# Regenerate rpms.lock.yaml with: ./hack/update-rpms-lock.sh
packages:
- git-core
- gnupg2
- tar
- gzip
contentOrigin:
  repofiles:
  - ./hi.repo
arches:
- x86_64
- aarch64
# MintMaker runs rpm-lockfile-prototype without the helper script's --bare flag.
# The tools stage also installs git-core into an empty installroot, so the lock
# must contain the complete dependency closure rather than only the base-image delta.
context:
  bare: true
